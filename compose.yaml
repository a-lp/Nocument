# Production: app image (nginx + gunicorn + LibreOffice) and MongoDB for the content blocks.
#
#   docker compose up -d --build
#
# To show the version (git commit) of the image in Settings, pass it to the build:
#
#   NOCUMENT_COMMIT=$(git rev-parse HEAD) NOCUMENT_COMMIT_DATE=$(git log -1 --format=%cI) docker compose up -d --build
#
# The app is reachable on http://localhost:8080 (another port with NOCUMENT_PORT=9000 docker compose up -d);
# MongoDB is only reachable from the app container. The server settings (e.g. the PDF renderer chosen in Settings)
# are kept in the nocument-settings volume, the plugins in the nocument-plugins volume (at the first start it gets
# the plugins of the image; to add a plugin package by hand: docker compose cp my_plugin app:/app/plugins/).
# NOCUMENT_PLUGIN_UPLOAD=false disables installing plugins from the web app (they run Python code on the server).
services:
  app:
    build:
      context: .
      args:
        NOCUMENT_COMMIT: ${NOCUMENT_COMMIT:-}
        NOCUMENT_COMMIT_DATE: ${NOCUMENT_COMMIT_DATE:-}
    image: nocument
    ports:
      - "${NOCUMENT_PORT:-8080}:80"
    # Optional variables of the backend (see .env.example); those under environment win over .env.
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: nocument
      NOCUMENT_PLUGIN_UPLOAD: ${NOCUMENT_PLUGIN_UPLOAD:-true}
    volumes:
      - nocument-settings:/app/instance
      - nocument-plugins:/app/plugins
    depends_on:
      - mongo
    networks:
      - nocument-net
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - nocument-net
    restart: unless-stopped

# Explicit subnet: change it if another network of the host already uses it.
networks:
  nocument-net:
    ipam:
      config:
        - subnet: 10.40.0.0/24

volumes:
  mongo-data:
  nocument-settings:
  nocument-plugins:
